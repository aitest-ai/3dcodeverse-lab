name: HY World 2 bridge checks
on:
  push:
    paths:
      - 'scripts/hyworld2/**'
      - 'scripts/blender5/hyworld_mesh_to_glb.py'
      - 'tests/test_hyworld2_bridge.py'
      - 'examples/threejs/load-hy-world.js'
      - '.github/workflows/hy-world-bridge-check.yml'
  pull_request:
    paths:
      - 'scripts/hyworld2/**'
      - 'tests/test_hyworld2_bridge.py'
      - 'examples/threejs/load-hy-world.js'
      - '.github/workflows/hy-world-bridge-check.yml'
permissions:
  contents: read
jobs:
  format-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python source syntax
        run: python3 -m py_compile scripts/hyworld2/pack_world.py scripts/blender5/hyworld_mesh_to_glb.py
      - name: Run isolated format and packaging tests
        run: python3 -m unittest discover -s tests -p 'test_hyworld2_bridge.py' -v
      - name: Check browser loader syntax
        run: node --input-type=module --check < examples/threejs/load-hy-world.js
