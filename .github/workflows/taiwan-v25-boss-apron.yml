name: Taiwan V25 - Bento Boss Apron and Headscarf
on:
  workflow_dispatch:
  push:
    branches: ['feat/taiwan-v25-boss-apron-identity']
    paths:
      - '.github/workflows/taiwan-v25-boss-apron.yml'
      - 'scripts/taiwan_v25/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: taiwan-v25-boss-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boss-wardrobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated wardrobe implementation
        run: python3 -m compileall -q scripts/taiwan_v25
      - name: Retrieve verified native V20 four-character sources
        uses: actions/download-artifact@v4
        with:
          name: taiwan-v20-native-sources-independently-verified-PILOT
          run-id: 41149410362
          github-token: ${{ github.token }}
          repository: aitest-ai/3dcodeverse-lab
          path: input/v20
      - name: Install CPU rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1
      - name: Install pinned Blender with official SHA256 check
        run: |
          set -euo pipefail
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 2 --max-time 300 -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 2 --max-time 60 -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import hashlib,pathlib,re
          name='blender-5.2.3-linux-x64.tar.xz'
          line=next(x for x in pathlib.Path('.tools/SHA256').read_text().splitlines() if name in x)
          expected=re.search(r'[0-9a-fA-F]{64}',line).group().lower()
          with open('.tools/'+name,'rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==expected
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Add original apron and headscarf, render actual source and delivered GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          V25_INPUT: input/v20
          V25_OUT: outputs/v25
        run: |
          set -o pipefail
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/taiwan_v25/build_review.py 2>&1 | tee /tmp/v25-blender.log
      - name: Validate exported skeleton, expressions and explicit scope
        run: |
          set -euo pipefail
          python3 scripts/blender5/validate_glb.py outputs/v25
          python3 scripts/taiwan_characters/verify_glb_mouth_morphs.py outputs/v25/boss_v25_apron.glb
          python3 scripts/taiwan_characters/verify_glb_mouth_morphs.py outputs/v25/boss_v25_apron_stress.glb
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('outputs/v25');d=json.loads((p/'report.json').read_text())
          assert d['native_body_vertices']==13380 and d['bones']==53 and d['body_morphs']==10
          assert d['new_accessories_only'] and len(d['unchanged_original_meshes'])==10
          assert len(d['renders'])==25 and all((p/'renders'/f).is_file() for f in d['renders'])
          assert d['stress_glb']['animations']==1 and d['stress_glb']['animation_channels']>=159
          assert d['source_max_panel_motion_m']>.01 and d['source_max_headscarf_motion_m']>.005
          assert d['delivered_reimport']['max_apron_motion_m']>.01
          assert d['delivered_reimport']['max_headscarf_motion_m']>.005
          assert len(d['source_61_frame_front_panel_checks'])==61
          assert d['art_approved'] is False and d['other_characters_changed'] is False
          print('V25_STRUCTURE_PASS_NOT_VISUAL_APPROVAL')
          PY
      - name: Attach exact source, reference, licensing provenance and logs
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,shutil,hashlib,json,os
          p=pathlib.Path('outputs/v25');(p/'qa').mkdir(parents=True,exist_ok=True)
          if pathlib.Path('/tmp/v25-blender.log').exists():shutil.copy('/tmp/v25-blender.log',p/'qa/blender.log')
          for folder in ('taiwan_v25','taiwan_v24','taiwan_v21','taiwan_v20','taiwan_waist_v19'):
              shutil.copytree('scripts/'+folder,p/'source'/folder,dirs_exist_ok=True,ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copy('scripts/blender5/validate_glb.py',p/'source/validate_glb.py')
          shutil.copy('.github/workflows/taiwan-v25-boss-apron.yml',p/'source/workflow.yml')
          for f in ('models/boss_v20_source.glb','qa/boss_v20_build.json','qa/faceunits_manifest.json','qa/mpfb_source_revision.txt'):
              src=pathlib.Path('input/v20')/f
              if src.exists():
                  target=p/'reference_v20'/f;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy(src,target)
          (p/'provenance.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'source_run':41149410362,'scope':'Only boss apron/headscarf add-on; uncle V24 belt unchanged elsewhere, no claim of remaining four characters','new_geometry_license':'CC0-1.0','software_licenses_unchanged':True,'art_approved':False},indent=2))
          (p/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p)) for f in sorted(p.rglob('*')) if f.is_file() and f.name!='SHA256SUMS.txt')+'\n')
          PY
      - name: Publish real wardrobe pilot or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-v25-boss-apron-headscarf-PILOT
          path: outputs/v25/**
          retention-days: 30
          if-no-files-found: warn
