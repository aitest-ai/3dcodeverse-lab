name: Emotion Voice Real Model Evaluation
on:
  push:
    branches: [feat/emotion-voice-studio-poc]
    paths: ['.github/workflows/emotion-voice-live-eval.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[voice-live-eval]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded API client, no model or GPU rental
        run: python -m pip install 'gradio_client==2.0.3'
      - name: Evaluate official bundled demo voice, at most four calls
        run: python experiments/emotion-voice-lab/probe_official_demo.py --output demo-probe-report.json
      - name: Preserve diagnostic metadata only, never voice audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotion-voice-real-evaluation-report
          path: demo-probe-report.json
          retention-days: 7
          if-no-files-found: warn
