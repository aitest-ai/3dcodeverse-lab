name: Mecha v6.6 Fair-Tactics Core QA
on:
  push:
    paths:
      - 'examples/threejs/mech-combat-pacing-v66.js'
      - 'examples/threejs/mech-unstuck-v66.js'
      - 'examples/threejs/mech-enemy-ai-v59.js'
      - 'examples/threejs/mech-mission-v60.js'
      - 'tests/mecha/v66-tactics.mjs'
      - '.github/workflows/mecha-v66-tactics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fair-tactics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and run portable enemy pacing and route-recovery tests
        run: |
          node --check examples/threejs/mech-combat-pacing-v66.js
          node --check examples/threejs/mech-unstuck-v66.js
          node --check examples/threejs/mech-enemy-ai-v59.js
          node --check examples/threejs/mech-mission-v60.js
          node tests/mecha/v66-tactics.mjs
