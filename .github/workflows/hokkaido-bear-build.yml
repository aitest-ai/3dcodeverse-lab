name: 3DCodeVerse Offline Bear Sculpting and GLB Export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hokkaido-bear-build.yml', 'tasks/hokkaido-bear/**', 'scripts/render_official_glb_bpy.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: upstream-3dcodeverse
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Blender 5.2.2 LTS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 4 --output "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr 'import bpy; print("Blender",bpy.app.version_string)'
      - name: Install official 3DCodeVerse Harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Blender static_object only: no Chromium/Puppeteer/Three.js render host.
          # Upstream setup explicitly supports --no-node / --no-chrome.
          python -m pip install -e upstream/harness
          3dcodeverse --help > /dev/null
          3dcode tools --help > /dev/null
      - name: Create official Harness workspace and load Blender model
        shell: bash
        run: |
          set -euo pipefail
          3dcode make "A traditional Hokkaido carved wooden bear tourist souvenir biting a salmon crosswise; full quadruped dark walnut sculpture with broad head, short muscular paws, carved fur and detailed salmon" \
            --track static_object --language blender \
            --generator single-shot:openai:openai/gpt-4.1 \
            --planner openai:openai/gpt-4.1 --judge openai:openai/gpt-4.1 \
            --rounds 0 --candidates 1 --no-run --slug hokkaido-bear \
            --runs-dir "$GITHUB_WORKSPACE/runs"
          cp tasks/hokkaido-bear/model.py runs/hokkaido_bear/src/model.py
          python -m py_compile runs/hokkaido_bear/src/model.py
      - name: OFFICIAL 3DCodeVerse spatial build and measurement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged
          3dcode tools build --workspace runs/hokkaido_bear --json '{}' --json-out | tee packaged/build-tool.log
          test -s runs/hokkaido_bear/artifacts/object.glb
          3dcode tools measure --workspace runs/hokkaido_bear --json '{}' --json-out | tee packaged/measure-tool.log
          cp runs/hokkaido_bear/artifacts/object.glb packaged/hokkaido_bear_official_harness.glb
          cp runs/hokkaido_bear/artifacts/measurement.json packaged/measurement.json
          cp runs/hokkaido_bear/artifacts/build.json packaged/build.json
          cp runs/hokkaido_bear/spec.json packaged/spec.json
          cp tasks/hokkaido-bear/model.py packaged/model.py
      - name: Blender Cycles render of actual official Harness GLB
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 --python-exit-code 1 \
            --python scripts/render_official_glb_bpy.py -- \
            runs/hokkaido_bear/artifacts/object.glb \
            runs/hokkaido_bear/artifacts 2>&1 | tee packaged/render-tool.log
          python -m pip install -q 'Pillow>=10,<13'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('runs/hokkaido_bear/artifacts')
          names=['view_front_right_high.png','view_front.png','view_back_left_high.png','view_top.png']
          canvas=Image.new('RGB',(1920,1440),(238,240,242))
          for i,name in enumerate(names):
              p=root/name
              assert p.exists() and p.stat().st_size>12000,p
              im=Image.open(p).convert('RGB').resize((960,720))
              canvas.paste(im,((i%2)*960,(i//2)*720))
          canvas.save(root/'sheet.png',compress_level=4)
          print('REAL_CYCLES_MULTIVIEW_SHEET_OK')
          PY
      - name: Collect preview and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p packaged
          python - <<'PY'
          import pathlib,shutil,json
          root=pathlib.Path('runs/hokkaido_bear/artifacts')
          folder=pathlib.Path('packaged')
          images=list(root.rglob('*.png')) if root.exists() else []
          ranked=sorted(images,key=lambda p:(0 if 'sheet' in p.name else 1,len(str(p))))
          for i,p in enumerate(ranked[:10]): shutil.copy2(p,folder/f'preview_{i:02d}_{p.name}')
          pkg=folder/'hokkaido_bear_official_harness.glb'
          (folder/'status.json').write_text(json.dumps({'official_harness_build_glb':pkg.exists(),'glb_bytes':pkg.stat().st_size if pkg.exists() else 0,'preview_count':len(ranked),'method':'Official spatial build/measure/render on assistant-authored Blender code; AI agent generation not invoked'},indent=2))
          PY
      - name: Upload actual official build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hokkaido-bear-offline-harness
          path: packaged/
          retention-days: 30
          if-no-files-found: warn

  supervise:
    name: Original-sculpt visual quality before latest promotion
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hokkaido-bear-offline-harness
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Review model's actual rendered views (unreviewed = reject)
        run: |
          mkdir -p art-review
          python scripts/supervisor_quality_gate.py \
            --allow-untextured-sculpt \
            --model candidate/hokkaido_bear_official_harness.glb \
            --hero candidate/preview_04_view_front_right_high.png \
            --side candidate/preview_03_view_back_left_high.png \
            --review reviews/hokkaido-bear/sculpt-latest.visual-review.json \
            --report art-review/art_supervisor_report.json
      - name: Save rejected candidate diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hokkaido-sculpt-supervisor-report
          path: art-review/
          retention-days: 90
          if-no-files-found: warn
  publish:
    needs: [build, supervise]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hokkaido-bear-offline-harness
          path: output
      - name: Publish confirmed output to main models folder
        shell: bash
        run: |
          set -euo pipefail
          test -s output/hokkaido_bear_official_harness.glb
          test -s output/preview_00_sheet.png
          test -s output/measurement.json
          DEST="models/hokkaido-bear/latest"
          mkdir -p "$DEST"
          cp -a output/. "$DEST/"
          printf "source_commit=%s\nactions_run=%s\nmethod=official 3DCodeVerse build on Blender source; no AI generator\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$DEST/PROVENANCE.txt"
          echo "Built model sha256:"
          sha256sum "$DEST/hokkaido_bear_official_harness.glb"
          git add -f "$DEST"
          git status --short
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "Files unchanged; nothing to publish."
          else
            git commit -m "Publish real 3DCodeVerse bear GLB and multiview renders [run $GITHUB_RUN_ID]"
            git push origin HEAD:main
          fi


  preview_candidate:
    name: Quarantine v20 shape preview (never auto-approve)
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: hokkaido-bear-offline-harness
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish authentic neutral views with an explicit UNREVIEWED gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'Pillow>=10,<13'
          DEST="experiments/hokkaido-v20/preview"
          mkdir -p "$DEST"
          test -s candidate/hokkaido_bear_official_harness.glb
          test -s candidate/preview_00_sheet.png
          test -s candidate/preview_02_view_front.png
          test -s candidate/preview_03_view_back_left_high.png
          test -s candidate/preview_04_view_front_right_high.png
          cp candidate/preview_00_sheet.png "$DEST/four_views.png"
          cp candidate/preview_02_view_front.png "$DEST/front.png"
          cp candidate/preview_03_view_back_left_high.png "$DEST/rear_three_quarter.png"
          cp candidate/preview_04_view_front_right_high.png "$DEST/front_three_quarter.png"
          cp candidate/preview_01_view_top.png "$DEST/top.png"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('experiments/hokkaido-v20/preview/four_views.png').convert('RGB')
          im.thumbnail((960,720))
          im.save('experiments/hokkaido-v20/preview/mobile_review.jpg', quality=76, optimize=True)
          PY
          sha256sum candidate/hokkaido_bear_official_harness.glb > "$DEST/source_glb_sha256.txt"
          printf '%s\n' \
            'Status: UNREVIEWED / NOT APPROVED FOR GAME' \
            "Source commit: $GITHUB_SHA" \
            "Action run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Method: official 3DCodeVerse Harness -> real Blender Cycles render' \
            'Rule: real geometry + art review must pass before promotion to models/hokkaido-bear/latest' \
            > "$DEST/STATUS.txt"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Quarantine v20 actual bear sculpt previews without approving release"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
