name: Mecha v6.3 Enemy Action and GLB Loader QA
on:
  push:
    paths:
      - 'examples/threejs/mech-enemy-action-v63.js'
      - 'examples/threejs/mech-enemy-glb-v63.js'
      - 'examples/threejs/mech-root-motion-v63.js'
      - 'tests/mecha/v63-action-loader.mjs'
      - '.github/workflows/mecha-v63-action.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and event-driven one-shot transitions
        run: |
          node --check examples/threejs/mech-enemy-action-v63.js
          node --check examples/threejs/mech-enemy-glb-v63.js
          node --check examples/threejs/mech-root-motion-v63.js
          node tests/mecha/v63-action-loader.mjs
