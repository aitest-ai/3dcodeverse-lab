name: Halows Mukaishima V11 Facade Materials
on:
  push:
    branches:
      - feat/halows-mukaishima-v11-facade-materials
    paths:
      - 'scripts/blender5/halows_mukaishima_v11_facade.py'
      - 'scripts/blender5/halows_mukaishima_v10_entryground.py'
      - 'scripts/blender5/halows_site_v09_data.py'
      - '.github/workflows/halows-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-halows-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and decode site lock
        run: |
          python3 -m py_compile scripts/blender5/halows_mukaishima_v11_facade.py
          python3 -m py_compile scripts/blender5/halows_site_v09_data.py
          python3 - <<'PY'
          import sys
          sys.path.append('scripts/blender5')
          from halows_site_v09_data import load_site_data
          d=load_site_data()
          grid=d['terrain']['grid']
          assert d['asset_id']=='halows-mukaishima-v09-geosite'
          assert len(grid['rows'])>=10
          assert len(grid['rows'][0])>=10
          assert grid['step_m']==20
          assert len(d['roads'])>=4
          print(d['origin_wgs84'], d['building']['long_axis_heading_deg_from_east_ccw'])
          PY
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1
      - name: Download Blender 5.2.3 LTS and verify official SHA256
        shell: bash
        run: |
          set -euo pipefail
          VERSION=5.2.3
          FILE="blender-${VERSION}-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender5.2"
          mkdir -p .tools
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o ".tools/$FILE" "$URL/$FILE"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o .tools/checksums.sha256 "$URL/blender-${VERSION}.sha256"
          python3 - <<'PY'
          import hashlib,re,pathlib
          filename="blender-5.2.3-linux-x64.tar.xz"
          line=next(x for x in pathlib.Path(".tools/checksums.sha256").read_text().splitlines() if filename in x)
          expected=re.search(r"(?<![0-9a-fA-F])[0-9a-fA-F]{64}(?![0-9a-fA-F])",line).group().lower()
          with open(".tools/"+filename,"rb") as f:
              actual=hashlib.file_digest(f,"sha256").hexdigest()
          assert actual==expected,(actual,expected)
          print("Blender SHA256 verified",actual)
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-${VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Build georeferenced site, BLEND, GLB and renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf outputs
          mkdir outputs
          xvfb-run -a blender -b --factory-startup --python scripts/blender5/halows_mukaishima_v11_facade.py
      - name: Validate outputs
        run: |
          for f in halows-mukaishima-v11-facade.blend halows-mukaishima-v11-facade.glb asset_manifest.json report.json site_lock.json; do
            test -s "outputs/$f"
          done
          for s in site_aerial route317_arrival forecourt north_overview entry_eye tower_identity apron_detail; do
            test -s "outputs/halows-mukaishima-v11-facade_${s}.png"
          done
          python3 scripts/blender5/validate_glb.py outputs
          test -s outputs/V11_procedural_asphalt.png
          test -s outputs/V11_procedural_apron_pavers.png
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('outputs/halows-mukaishima-v11-facade.glb')
          with p.open('rb') as f:
              raw=f.read(20)
              assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,4)[0]==2
              length=struct.unpack_from('<I',raw,12)[0]
              assert raw[16:20]==b'JSON'
              gltf=json.loads(f.read(length).decode('utf-8'))
          names={n.get('name') for n in gltf.get('nodes',[])}
          for name in ['V11_katakana_sign','V11_english_sign','V11_arch_recess_noninterior',
                       'V11_sliding_track_upper','V11_canopy_underside']:
              assert name in names,name
          assert len(gltf.get('images',[]))>=2, 'Two original texture images must be embedded'
          m=json.loads(Path('outputs/asset_manifest.json').read_text())
          assert len(m['files'])>=12
          assert m['font_asset_shipped'] is False
          assert m['browser_tested'] is False
          print('V11 source-locked GLB SIGN/ARCH/TEXTURE QA PASS')
          PY
          python3 -m json.tool outputs/site_lock.json >/dev/null
          python3 -m json.tool outputs/asset_manifest.json >/dev/null
          python3 -m json.tool outputs/report.json >/dev/null
          ls -lah outputs
      - name: Upload V11 candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halows-mukaishima-v11-facade-${{ github.run_number }}
          path: outputs/
          retention-days: 14
          if-no-files-found: warn
