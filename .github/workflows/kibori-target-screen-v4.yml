name: Hokkaido Kibori Real Source Screen v4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kibori-target-screen-v4.yml
      - scripts/woodcarving_candidate_screen_v4.py
permissions:
  contents: write
jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright for visual references
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m py_compile scripts/woodcarving_candidate_screen_v4.py
      - name: Capture publisher pages, record license and access gate
        run: python scripts/woodcarving_candidate_screen_v4.py --out candidate-audit
      - name: Upload unapproved audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wooden-bear-target-scout-v4-UNREVIEWED
          path: candidate-audit/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish noncopyright summary for status tracking
        if: always()
        shell: bash
        run: |
          mkdir -p experiments/kibori-target-v4
          python - <<'PY'
          import json,os,pathlib
          source=pathlib.Path("candidate-audit/manifest.json")
          manifest=json.loads(source.read_text()) if source.exists() else {"candidates":[],"error":"audit did not finish"}
          compact=[]
          for c in manifest.get("candidates",[]):
              compact.append({k:c.get(k) for k in ["name","page","source_license","access_policy","http_status","title","public_page_captured","screenshot_sha256","error"] if c.get(k) is not None})
          info={"workflow_run_id":int(os.environ.get("GITHUB_RUN_ID","0")),"workflow_url":"https://github.com/"+os.environ.get("GITHUB_REPOSITORY","")+"/actions/runs/"+os.environ.get("GITHUB_RUN_ID",""),"candidates":compact,"model_glb_acquired":False,"shape_approved":False}
          pathlib.Path("experiments/kibori-target-v4/status.json").write_text(json.dumps(info,ensure_ascii=False,indent=2)+"\n")
          PY
          git add experiments/kibori-target-v4/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record woodcarving source audit evidence status" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
