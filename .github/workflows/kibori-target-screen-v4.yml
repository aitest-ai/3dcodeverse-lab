name: Hokkaido Kibori Real Source Screen v4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kibori-target-screen-v4.yml
      - scripts/woodcarving_candidate_screen_v4.py
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright for visual references
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m py_compile scripts/woodcarving_candidate_screen_v4.py
      - name: Capture publisher pages, record license and access gate
        run: python scripts/woodcarving_candidate_screen_v4.py --out candidate-audit
      - name: Upload unapproved audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wooden-bear-target-scout-v4-UNREVIEWED
          path: candidate-audit/
          retention-days: 30
          if-no-files-found: warn
