name: Mecha v7.1 Terrain-aware Wreck Core QA
on:
  push:
    paths:
      - 'examples/threejs/mech-wreck-ground-v71.js'
      - 'tests/mecha/v71-wreck-ground.mjs'
      - '.github/workflows/mecha-v71-ground.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wreck-ground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original v7.1 released math with Node
        run: |
          node --check examples/threejs/mech-wreck-ground-v71.js
          node tests/mecha/v71-wreck-ground.mjs
