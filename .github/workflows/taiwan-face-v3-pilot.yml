name: Taiwanese Face V3 - Genuine MPFB Morph Pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taiwan-face-v3-pilot.yml'
      - 'scripts/taiwan_characters/face_v3_pilot.py'
permissions:
  contents: read
jobs:
  face-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Compile face prototype
        run: python3 -m py_compile scripts/taiwan_characters/face_v3_pilot.py
      - name: Install CPU Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1 unzip
      - name: Blender LTS official verified download
        run: |
          set -euo pipefail
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 4 -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 4 -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          fn='blender-5.2.3-linux-x64.tar.xz'
          line=next(l for l in Path('.tools/SHA256').read_text().splitlines() if fn in l)
          digest=re.search(r'[0-9a-fA-F]{64}',line).group().lower()
          with open('.tools/'+fn,'rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Install licensed official MPFB 2.0.18 Blender extension
        run: |
          set -euo pipefail
          mkdir -p .deps
          git clone -q --depth 1 https://github.com/makehumancommunity/mpfb2.git .deps/mpfb2
          grep -q 'version = "2.0.18"' .deps/mpfb2/src/mpfb/blender_manifest.toml
          blender --command extension build --source-dir .deps/mpfb2/src/mpfb --output-filepath "$PWD/.tools/mpfb.zip"
          blender --command extension repo-add local_mpfb --directory "$PWD/.tools/mpfb-extensions"
          blender --command extension install-file --repo local_mpfb --enable "$PWD/.tools/mpfb.zip"
      - name: Restore cached official CC0 asset pack
        uses: actions/cache@v4
        with:
          path: .tools/makehuman_system_assets_cc0.zip
          key: makehuman-asset-packs-2026-10-30-v1
      - name: Retrieve and unpack official MakeHuman CC0 face assets
        run: |
          set -euo pipefail
          FILE=.tools/makehuman_system_assets_cc0.zip
          if [ ! -s "$FILE" ]; then
            for host in files2.makehumancommunity.org files.makehumancommunity.org; do
              if curl -fL --retry 2 --connect-timeout 25 --max-time 420 \
                  -o "$FILE" "https://$host/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip"; then break; fi
              rm -f "$FILE"
            done
          fi
          test "$(stat -c%s "$FILE")" -gt 200000000
          unzip -tq "$FILE" >/dev/null
          mkdir -p .deps/mh_assets
          unzip -oq "$FILE" -d .deps/mh_assets
          test -n "$(find .deps/mh_assets -name 'high-poly.mhclo' -print -quit)"
          test -n "$(find .deps/mh_assets -name 'young_caucasian_female.mhmat' -print -quit)"
      - name: Face-first prototype (two characters only)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MAKEHUMAN_ASSET_ROOT: .deps/mh_assets
          FACE_OUT: outputs/face_v3
        run: |
          set -euo pipefail
          mkdir -p outputs/face_v3
          for id in you boss; do
            FACE_ID="$id" xvfb-run -a blender -b --python-exit-code 1 --python scripts/taiwan_characters/face_v3_pilot.py
          done
      - name: Validate presence of genuine Blender renders
        run: |
          set -euo pipefail
          for id in you boss; do
            test -s outputs/face_v3/"$id"_v3_face.png
            test -s outputs/face_v3/"$id"_v3_front.png
            test -s outputs/face_v3/"$id"_v3_side.png
            python3 -m json.tool outputs/face_v3/"$id"_v3_report.json >/dev/null
          done
      - name: Upload face QA render evidence (NOT final game characters)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-face-v3-PILOT-NOT-APPROVED
          path: outputs/face_v3/
          retention-days: 14
          if-no-files-found: warn
