name: Emotion Voice Free-Only Happy Retest
on:
  push:
    branches: [feat/emotion-voice-studio-poc]
    paths: ['.github/workflows/emotion-voice-free-retest.yml']
permissions:
  contents: read
concurrency:
  group: emotion-voice-free-only
  cancel-in-progress: false
jobs:
  retest:
    if: github.event.repository.private == false && contains(github.event.head_commit.message, '[voice-free-retest]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_TOKEN: ''
      HUGGING_FACE_HUB_TOKEN: ''
      GRADIO_ANALYTICS_ENABLED: 'False'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm public repo and zero-cost boundaries
        run: |
          test '${{ github.event.repository.private }}' = 'false'
          echo 'Standard public-repository runner only. No paid GPU, account token, artifact or cache upload.'
      - name: Install API client only; no model weights
        run: python -m pip install --no-cache-dir 'gradio_client==2.0.3'
      - name: Request at most six free demo samples; stop on first error
        run: python experiments/emotion-voice-lab/free_retest.py --output free-retest-report.json
      - name: Log bounded diagnostic report without storing billable artifacts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('free-retest-report.json')
          if p.exists():
              r=json.loads(p.read_text())
              print('RESULT',r['status'],'AUDIO_COUNT',r.get('successful_audio_count',0))
          else:
              print('No inference report; setup failed. No automatic retry.')
          PY
