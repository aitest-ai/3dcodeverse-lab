name: Taiwan Street Game - V17 Original MPFB Knit Layer QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/taiwan-characters.yml'
      - 'scripts/taiwan_characters/**'
  push:
    paths:
      - '.github/workflows/taiwan-characters.yml'
      - 'scripts/taiwan_characters/**'
permissions:
  contents: read
  actions: read
jobs:
  build-taiwan-characters:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m compileall -q scripts/taiwan_characters
      # All v11 humans are generated independently from genuine MPFB2 source.
      # The obsolete original female BLEND download is intentionally removed.
      - name: Verify official CC0 ARKit-style 52 faceunit source and filenames
        run: |
          set -euo pipefail
          python3 scripts/taiwan_characters/verify_faceunits_pack.py
          python3 -m json.tool .deps/mh_faceunits/faceunits_manifest.json >/dev/null
      - name: Upload official faceunit target audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-original-CC0-faceunits-target-audit
          path: .deps/mh_faceunits/faceunits_manifest.json
          retention-days: 14
      - name: Install CPU rendering and image checking requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1 python3-pil
      - name: Install Blender 5.2.3 with upstream SHA256 verification
        run: |
          set -euo pipefail
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 4 --retry-all-errors -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          name="blender-5.2.3-linux-x64.tar.xz"
          line=next(line for line in Path(".tools/SHA256").read_text().splitlines() if name in line)
          checksum=re.search(r"[0-9a-fA-F]{64}",line).group().lower()
          with open(".tools/"+name,"rb") as f:
              assert hashlib.file_digest(f,"sha256").hexdigest()==checksum
          print("BLENDER_VERIFIED_SHA256",checksum)
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Install the official MPFB 2.0.18 extension for real phenotype morphing
        run: |
          set -euo pipefail
          mkdir -p .deps
          git clone --depth 1 -q https://github.com/makehumancommunity/mpfb2.git .deps/mpfb2
          grep -q 'version = "2.0.18"' .deps/mpfb2/src/mpfb/blender_manifest.toml
          blender --command extension build --source-dir .deps/mpfb2/src/mpfb --output-filepath "$PWD/.tools/mpfb.zip"
          blender --command extension repo-add local_mpfb --directory "$PWD/.tools/mpfb-extensions"
          blender --command extension install-file --repo local_mpfb --enable "$PWD/.tools/mpfb.zip"
          blender --command extension list
# ART-REJECTED: production 34-file zip disabled until true MPFB face pilot passes human review.
      - name: Restore cached official CC0 asset pack
        uses: actions/cache@v4
        with:
          path: .tools/makehuman_system_assets_cc0.zip
          key: makehuman-asset-packs-2026-10-30-v1
      - name: Retrieve and unpack official MakeHuman CC0 face assets
        run: |
          set -euo pipefail
          FILE=.tools/makehuman_system_assets_cc0.zip
          if [ ! -s "$FILE" ]; then
            for host in files2.makehumancommunity.org files.makehumancommunity.org; do
              if curl -fL --retry 2 --connect-timeout 25 --max-time 420 \
                  -o "$FILE" "https://$host/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip"; then break; fi
              rm -f "$FILE"
            done
          fi
          test "$(stat -c%s "$FILE")" -gt 200000000
          unzip -tq "$FILE" >/dev/null
          mkdir -p .deps/mh_assets
          unzip -oq "$FILE" -d .deps/mh_assets
          test -n "$(find .deps/mh_assets -name 'high-poly.mhclo' -print -quit)"
          test -n "$(find .deps/mh_assets -name 'young_caucasian_female.mhmat' -print -quit)"
      - name: Restore official CC0 clothing pack cache
        uses: actions/cache@v4
        with:
          path: |
            .deps/shirts01_cc0.zip
            .deps/pants01_cc0.zip
          key: official-mh-shirts01-pants01-cc0-v1
      - name: Download official CC0 MakeHuman shirts01 and pants01
        run: |
          set -euo pipefail
          for pack in shirts01 pants01; do
            file=".deps/$pack""_cc0.zip"
            if [ ! -s "$file" ]; then
              for host in files2.makehumancommunity.org files.makehumancommunity.org; do
                if curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
                  -o "$file" "https://$host/asset_packs/$pack/$pack""_cc0.zip"; then break; fi
                rm -f "$file"
              done
            fi
            test "$(stat -c%s "$file")" -gt 1000000
            unzip -tq "$file" >/dev/null
            unzip -oq "$file" -d .deps/mh_assets
          done
          for basename in namuhekam_male_polo_shirt cortu_cargo_pants toigo_fisherman_sweater toigo_wool_pants; do
            test -n "$(find .deps/mh_assets -name "$basename.mhclo" -print -quit)"
          done
      - name: V17 real original MPFB knit trousers layering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MAKEHUMAN_ASSET_ROOT: .deps/mh_assets
          FACEUNITS_ROOT: .deps/mh_faceunits
          FACE_OUT: outputs/face_v17
          FACE_EXPORT_GLB: '1'
        run: |
          set -euo pipefail
          mkdir -p outputs/face_v17
          for id in you boss uncle jie; do
            FACE_ID="$id" FACE_HAIR_CHOICE=ponytail01 xvfb-run -a blender -b \
              --python-exit-code 1 --python scripts/taiwan_characters/face_v17_knit_layer_qa.py
          done
      - name: Validate V17 source mesh layer, genuine 13380 vertices and all 4 GLBs
        run: |
          set -euo pipefail
          for stem in you_v17_main boss_v17_ponytail01 uncle_v17_main jie_v17_main; do
            p="outputs/face_v17/$stem.glb"
            ok=0
            for maxpx in 512 448 384 320; do
              if python3 scripts/taiwan_characters/optimize_embedded_glb.py "$p" "$p.optimized" "$maxpx"; then
                ok=1;break
              fi
            done
            test "$ok" -eq 1
            mv "$p.optimized" "$p"
            python3 scripts/taiwan_characters/verify_glb_mouth_morphs.py "$p"
          done
          python3 - <<'PY'
          import json,pathlib,struct
          root=pathlib.Path("outputs/face_v17")
          for stem in ("you_v17_main","boss_v17_ponytail01","uncle_v17_main","jie_v17_main"):
              d=json.loads((root/(stem+"_report.json")).read_text())
              assert d["body_vertices"]==13380
              assert len(d["arkit_style_shape_keys"])==10
              assert len(d["expression_previews"])==3
              if d["character"]=="jie":
                  before=d["front_waist_before"]
                  after=d["front_waist_after"]
                  assert before and after, "missing real boundary loop data"
                  assert after["front_max_bare_gap_m"]<=.006, after
                  assert d["waistband_repair"]["moved_vertices"]>=0
                  assert "waist_front" in str(d["views"]), d["views"]
                  print("V15_JIE_FRONT_BOUNDARY_PASS",before["front_max_bare_gap_m"],after["front_max_bare_gap_m"])
              if d["character"]=="boss":
                  assert d["boss_chest_depth_diagnostic"], "no genuine chest profile"
                  assert "chest_front" in str(d["views"]), d["views"]
                  vis=d["boss_sweater_front_visibility"]
                  assert vis is not None and vis["body_hitting_rays"]>600, vis
                  assert vis["front_exposed_body_samples"]==0, vis
                  before=d["boss_knit_layer_before"]
                  after=d["boss_knit_layer_after"]
                  fix=d["boss_knit_layer_adjustment"]
                  assert before and after and fix
                  assert fix["no_faces_created_or_deleted"] and fix["all_shape_keys_also_moved"]
                  assert after["pants_in_front"]<before["pants_in_front"]
                  print("V17_REAL_MPF_BOSS_SWEATER_LAYER",before["pants_in_front"],
                        after["pants_in_front"],fix["moved_original_vertices"])
                  assert d["overlap_hidden_trouser_faces_removed"]==0
                  print("V16_BOSS_GARMENT_OCCLUSION_VERIFIED",vis)
              assert len(d['separate_open_source_garments'])==2
              child=d["fitted_face_accessory_keys_after_renaming"]
              assert any("mouthOpen" in keys for name,keys in child.items()
                         if "teeth" in name.lower() or "tongue" in name.lower()),child
              glb=root/(stem+".glb")
              with glb.open("rb") as f:
                  magic,version,total=struct.unpack("<4sII",f.read(12))
                  n,kind=struct.unpack("<I4s",f.read(8))
                  doc=json.loads(f.read(n))
              assert magic==b"glTF" and version==2 and total==glb.stat().st_size<=6000000
              assert doc.get("skins")
              mm=[m for m in doc["meshes"] if m.get("extras",{}).get("targetNames")]
              assert any(len(m["extras"]["targetNames"])==10 for m in mm)
              accessory_targets={m["name"]:m.get("extras",{}).get("targetNames",[])
                                 for m in doc["meshes"]}
              assert any("mouthOpen" in keys for name,keys in accessory_targets.items()
                         if "teeth" in name.lower() or "tongue" in name.lower()),accessory_targets
              print("V16_FOUR_FACE_AND_GARMENT_GEOMETRY_VERIFIED",stem,total,child)
          PY
      - name: Publish V17 4 actual Blender source-model characters and knit QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-v17-four-real-MPFB-knitted-layer-PILOT
          path: |
            outputs/face_v17/*.glb
            outputs/face_v17/*.png
            outputs/face_v17/*_report.json
            .deps/mh_faceunits/faceunits_manifest.json
          retention-days: 14
          if-no-files-found: warn
