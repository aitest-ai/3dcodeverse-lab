name: Horse CC0 Public Mirror Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/horse-mirror-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/horse-mirror-probe.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 horse from public project that credits Quaternius
        run: |
          set -euo pipefail
          mkdir -p outputs/horse_mirror
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
            -o outputs/horse_mirror/horse.glb \
            https://raw.githubusercontent.com/crisleyhguimaraes/space-ship/main/public/models/adventurers/horse.glb
          python3 - <<'PY'
          import json,struct,hashlib,pathlib
          p=pathlib.Path("outputs/horse_mirror/horse.glb")
          with p.open("rb") as f:
            magic,version,size=struct.unpack("<4sII",f.read(12))
            assert magic==b"glTF" and version==2 and size==p.stat().st_size
            length,kind=struct.unpack("<I4s",f.read(8))
            assert kind==b"JSON"
            d=json.loads(f.read(length))
          result={"url":"https://raw.githubusercontent.com/crisleyhguimaraes/space-ship/main/public/models/adventurers/horse.glb",
            "credited_to":"Quaternius Poly Pizza CC0","sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "bytes":p.stat().st_size,"meshes":len(d.get("meshes",[])),
            "skins":len(d.get("skins",[])),
            "animations":[a.get("name") for a in d.get("animations",[])],
            "extensionsRequired":d.get("extensionsRequired",[])}
          print(json.dumps(result,indent=2))
          pathlib.Path("outputs/horse_mirror/inspection.json").write_text(json.dumps(result,indent=2))
          assert d.get("meshes") and d.get("skins") and d.get("animations")
          PY
      - name: Deliver independently verifiable source copy and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horse-mirror-probe-${{ github.run_number }}
          path: outputs/horse_mirror/
          retention-days: 14
          if-no-files-found: warn
