name: Horse Library — Publish Approved New Horse
on:
  workflow_dispatch:
    inputs:
      submission_manifest:
        description: 'Merged reviewed manifest path, e.g. assets/horses/submissions/horse-palomino.json'
        type: string
        required: true
      confirmation:
        description: 'Type PUBLISH_APPROVED to authorize a permanent versioned Release'
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_APPROVED'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST: ${{ inputs.submission_manifest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed manifest path and derive immutable tag
        id: meta
        run: |
          python3 - <<'PY'
          import os,re,json
          from pathlib import Path
          folder=Path("assets/horses/submissions").resolve()
          rel=Path(os.environ["MANIFEST"])
          path=rel.resolve()
          if folder not in path.parents or path.suffix!=".json":
              raise RuntimeError("Only reviewed assets/horses/submissions/*.json allowed")
          data=json.loads(path.read_text())
          if data.get("status") not in ("in_review","candidate_pending_review"):
              raise RuntimeError("Unexpected or already published submission state")
          if not re.fullmatch("[a-z][a-z0-9-]{2,62}",data.get("asset_id","")):
              raise RuntimeError("Unsafe asset id")
          if not re.fullmatch(r"\d+\.\d+\.\d+",data.get("version","")):
              raise RuntimeError("Unsafe version")
          run=data.get("build",{}).get("run_id")
          artifact=data.get("build",{}).get("artifact_name","")
          part=data.get("build",{}).get("artifact_model_path",data.get("model_file",""))
          if not isinstance(run,int) or run<1 or not re.fullmatch("[A-Za-z0-9_-]{3,128}",str(artifact)):
              raise RuntimeError("Missing auditable CI source run or unsafe artifact")
          part_path=Path(part)
          if part_path.is_absolute() or ".." in part_path.parts or not part_path.parts or not re.fullmatch(r"[A-Za-z0-9_./-]+",str(part_path)):
              raise RuntimeError("Unsafe artifact path")
          tag=data["asset_id"]+"-v"+data["version"]
          for name,value in [
               ("release_tag",tag),
               ("asset_id",data["asset_id"]),
               ("version",data["version"]),
               ("artifact_run",str(run)),
               ("artifact_name",artifact),
               ("model_path",str(part_path))]:
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write(name+"="+value+"\n")
          print("APPROVED_RELEASE_META",tag)
          PY
      - name: Reject duplicate release tags — never replace any old horse
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ERROR: Horse version already published: $TAG" >&2
            exit 1
          fi
      - name: Fetch exact candidate's original CI artifact
        env:
          RUN_ID: ${{ steps.meta.outputs.artifact_run }}
          ARTIFACT: ${{ steps.meta.outputs.artifact_name }}
        run: |
          mkdir -p inputs
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir inputs
      - name: SHA256, license and GLB skin/animation validation before publication
        env:
          MODEL_REL: ${{ steps.meta.outputs.model_path }}
          ID: ${{ steps.meta.outputs.asset_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/horses/validate_horse_submission.py "$MANIFEST" --glb "inputs/$MODEL_REL" --output /tmp/horse-validation.json
          python3 - <<'PY'
          import os,shutil,json
          from pathlib import Path
          src=Path("inputs")/os.environ["MODEL_REL"]
          out=Path("dist");out.mkdir(exist_ok=True)
          filename="horse-"+os.environ["ID"]+"-v"+os.environ["VERSION"]+".glb"
          shutil.copy2(src,out/filename)
          shutil.copy2(os.environ["MANIFEST"],out/"asset_manifest.json")
          shutil.copy2("/tmp/horse-validation.json",out/"validation.json")
          summary=json.loads(Path(os.environ["MANIFEST"]).read_text())
          lines=[
            "# "+summary.get("title",summary["asset_id"]),
            "Author: "+summary["creator"],
            "License: "+summary["license"],
            "Source: "+summary["source_url"],
            "Model: "+filename,
            "Validation: GLB SHA256, skin and required animation clips checked. Visual/human review remains essential.",
            "This release is a versioned derivative. Original prior tags MUST NOT be replaced."
          ]
          (out/"SOURCE_AND_LICENSE.md").write_text("\n".join(lines)+"\n")
          PY
          (cd dist && sha256sum *.glb > SHA256SUMS.txt)
      - name: Create NEW versioned permanent Release, never clobber older models
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          gh release create "$TAG" dist/*.glb \
            dist/asset_manifest.json dist/validation.json dist/SHA256SUMS.txt \
            dist/SOURCE_AND_LICENSE.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG — reviewed horse model" \
            --notes-file dist/SOURCE_AND_LICENSE.md \
            --latest=false
          echo "Now add this new release and pinned hash to assets/horses/registry.json via a separate PR."
