name: Probe GitHub Models for 3DCodeVerse
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-github-models.yml']
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub Models API using workflow token
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          endpoint='https://models.github.ai/inference/chat/completions'
          payload={'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'Reply with exactly SNOWBEAR-8642'}], 'max_tokens':16}
          req=urllib.request.Request(endpoint,data=json.dumps(payload).encode('utf-8'),headers={'Authorization':'Bearer '+os.environ['GH_MODELS_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=35) as res:
                  raw=res.read()
                  print('HTTP status',res.status,'Content-Type',res.headers.get('Content-Type'),'bytes',len(raw))
                  print('Body first 600',repr(raw[:600].decode('utf-8','replace')))
                  if res.headers.get('Content-Type', '').lower().startswith('application/json'):
                      ans=json.loads(raw)
                      print('Model JSON response:',(ans.get('choices') or [{}])[0].get('message',{}).get('content'))
                  else:
                      print('Non-JSON API reply, cannot use official OpenAI-compatible adapter')
          except urllib.error.HTTPError as e:
              print('GitHub Models access failed; HTTP',e.code)
              print(e.read().decode('utf-8','replace')[:1200])
              raise SystemExit(1)
          PY
