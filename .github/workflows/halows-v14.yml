name: Halows Mukaishima V14 Forecourt Refine
on:
  push:
    branches:
      - feat/halows-mukaishima-v14-forecourt
    paths:
      - 'scripts/blender5/halows_mukaishima_v14_forecourt.py'
      - 'scripts/blender5/halows_mukaishima_v10_entryground.py'
      - 'scripts/blender5/halows_site_v09_data.py'
      - '.github/workflows/halows-v14.yml'
  pull_request:
    branches:
      - feat/halows-mukaishima-v13-glb-geobridge
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-halows-v14:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and decode site lock
        run: |
          python3 -m py_compile scripts/blender5/halows_mukaishima_v14_forecourt.py
          python3 -m py_compile scripts/blender5/halows_site_v09_data.py
          python3 - <<'PY'
          import sys
          sys.path.append('scripts/blender5')
          from halows_site_v09_data import load_site_data
          d=load_site_data()
          grid=d['terrain']['grid']
          assert d['asset_id']=='halows-mukaishima-v09-geosite'
          assert len(grid['rows'])>=10
          assert len(grid['rows'][0])>=10
          assert grid['step_m']==20
          assert len(d['roads'])>=4
          print(d['origin_wgs84'], d['building']['long_axis_heading_deg_from_east_ccw'])
          PY
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1
      - name: Download Blender 5.2.3 from official mirror and verify pinned checksum
        shell: bash
        run: |
          set -euo pipefail
          FILE=blender-5.2.3-linux-x64.tar.xz
          EXPECTED=78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec
          mkdir -p .tools
          for BASE in \
            "https://mirror.blender.org/release/Blender5.2" \
            "https://download.blender.org/release/Blender5.2" \
            "https://mirror.nju.edu.cn/blender/blender-release/Blender5.2"; do
            echo "Trying $BASE"
            if curl -fL --retry 2 --connect-timeout 30 --max-time 150 -o ".tools/$FILE" "$BASE/$FILE"; then
              echo "$EXPECTED  .tools/$FILE" | sha256sum -c -
              break
            fi
            rm -f ".tools/$FILE"
          done
          test -s ".tools/$FILE"
          echo "$EXPECTED  .tools/$FILE" | sha256sum -c -
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Build georeferenced site, BLEND, GLB and renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf outputs
          mkdir outputs
          xvfb-run -a blender -b --factory-startup --python scripts/blender5/halows_mukaishima_v14_forecourt.py
      - name: Validate outputs
        run: |
          for f in halows-mukaishima-v14-forecourt.blend halows-mukaishima-v14-forecourt.glb asset_manifest.json report.json site_lock.json; do
            test -s "outputs/$f"
          done
          for s in site_aerial forecourt entry_eye tower_identity apron_detail roof_edge facade_oblique; do
            test -s "outputs/halows-mukaishima-v14-forecourt_${s}.png"
          done
          python3 scripts/blender5/validate_glb.py outputs
          test -s outputs/V11_procedural_asphalt.png
          test -s outputs/V11_procedural_apron_pavers.png
          test -s outputs/V14_original_roof_albedo.png
          test -s outputs/V14_original_ground_albedo.png
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('outputs/halows-mukaishima-v14-forecourt.glb')
          with p.open('rb') as f:
              raw=f.read(20)
              assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,4)[0]==2
              length=struct.unpack_from('<I',raw,12)[0]
              assert raw[16:20]==b'JSON'
              gltf=json.loads(f.read(length).decode('utf-8'))
          names={n.get('name') for n in gltf.get('nodes',[])}
          for name in ['V11_katakana_sign','V11_english_sign','V11_arch_recess_noninterior',
                       'V11_sliding_track_upper','V11_canopy_underside',
                       'V14_roof_cap_front','V14_lot_edge_south','V14_entry_weep_sill']:
              assert name in names,name
          assert len(gltf.get('images',[]))>=4, 'Four original textures must be embedded'
          m=json.loads(Path('outputs/asset_manifest.json').read_text())
          assert len(m['files'])>=14
          assert m['font_asset_shipped'] is False
          assert m['browser_tested'] is False
          assert m['route_accepted'] is False
          report=json.loads(Path('outputs/report.json').read_text())
          assert report['runtime_integrated'] is False
          assert report['bike_route_approved'] is False
          print('V14 real Blender material and geometry QA PASS')
          PY
          python3 -m json.tool outputs/site_lock.json >/dev/null
          python3 -m json.tool outputs/asset_manifest.json >/dev/null
          python3 -m json.tool outputs/report.json >/dev/null
          ls -lah outputs
      - name: Upload V11 candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halows-mukaishima-v14-forecourt-${{ github.run_number }}
          path: outputs/
          retention-days: 14
          if-no-files-found: warn
