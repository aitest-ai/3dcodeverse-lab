name: Horse Original Quaternius CC0 PixelTriks Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/horse-pixeltriks-probe.yml'
      - 'scripts/horses/probe_pixeltriks.py'
  pull_request:
    paths:
      - '.github/workflows/horse-pixeltriks-probe.yml'
      - 'scripts/horses/probe_pixeltriks.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile and inspect public asset host
        run: |
          python3 -m py_compile scripts/horses/probe_pixeltriks.py
          python3 -u scripts/horses/probe_pixeltriks.py
      - name: Upload source discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-source-probe-${{ github.run_number }}
          path: outputs/pixeltriks_probe/
          retention-days: 7
          if-no-files-found: warn
