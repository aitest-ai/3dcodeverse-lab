name: Mecha v7.8 Real Render Capture Reference QA
on:
  push:
    paths:
      - 'examples/threejs/mech-real-capture-reference-v78.js'
      - 'tests/mecha/v78-real-capture-reference.mjs'
      - '.github/workflows/mecha-v78-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check genuine render-capture state logic without fake screenshots
        run: |
          node --check examples/threejs/mech-real-capture-reference-v78.js
          node tests/mecha/v78-real-capture-reference.mjs
