name: Mecha v6.2 Enemy Visual GLB Bridge QA
on:
  push:
    paths:
      - 'examples/threejs/mech-enemy-glb-v62.js'
      - 'tests/mecha/v62-enemy-visual.mjs'
      - '.github/workflows/mecha-v62-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-loader-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact loader source and model fallback semantics
        run: |
          node --check examples/threejs/mech-enemy-glb-v62.js
          node tests/mecha/v62-enemy-visual.mjs
