name: Racing Horse V2.3 — UV and Real Coat PBR
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/racing-horse-v23-pbr.yml'
      - 'scripts/horses/v23_make_coat_textures.py'
      - 'scripts/horses/v23_blender_pbr.py'
  pull_request:
    paths:
      - '.github/workflows/racing-horse-v23-pbr.yml'
      - 'scripts/horses/v23_make_coat_textures.py'
      - 'scripts/horses/v23_blender_pbr.py'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile texture generator and Blender scripts
        run: python3 -m py_compile scripts/horses/v23_make_coat_textures.py scripts/horses/v23_blender_pbr.py
      - name: Restore verified original two-horse V2.2 rig and animations
        uses: actions/download-artifact@v4
        with:
          repository: aitest-ai/3dcodeverse-lab
          run-id: '41013238601'
          name: horse-v22-5
          github-token: ${{ github.token }}
          path: inputs/v22
      - name: Install open-source map generator and headless Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1 python3-pil python3-numpy
      - name: Produce actual 1024x1024 coat albedo, tangent normal and roughness PNG
        run: |
          set -euo pipefail
          for horse in Horse Horse_White; do
            /usr/bin/python3 scripts/horses/v23_make_coat_textures.py "$horse" "outputs/v23/$horse/maps"
          done
      - name: Install official Blender 5.2.3 verified SHA256
        run: |
          set -euo pipefail
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 3 -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 3 -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          f=Path(".tools/blender-5.2.3-linux-x64.tar.xz")
          line=next(x for x in Path(".tools/SHA256").read_text().splitlines() if f.name in x)
          want=re.search(r"[a-fA-F0-9]{64}",line).group().lower()
          with f.open("rb") as src:assert hashlib.file_digest(src,"sha256").hexdigest()==want
          print("OFFICIAL_BLENDER_SHA256_PASS")
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Preserve 50 bones & 13 clips, add glTF export-safe PBR UV images and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for horse in Horse Horse_White; do
            echo "::group::PBR horse $horse"
            xvfb-run -a blender -b --factory-startup --python-exit-code 1 \
              --python scripts/horses/v23_blender_pbr.py -- \
              "inputs/v22/$horse/${horse}_V22.blend" "outputs/v23/$horse/maps" "outputs/v23/$horse"
            echo "::endgroup::"
          done
      - name: Independently verify actual exported GLB PBR images UV, skin and animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          for horse in ("Horse","Horse_White"):
            folder=Path("outputs/v23")/horse
            report=json.loads((folder/"v23_report.json").read_text())
            path=folder/(horse+"_V23.glb")
            blob=path.read_bytes()
            magic,ver,size=struct.unpack_from("<4sII",blob,0)
            assert magic==b"glTF" and ver==2 and size==len(blob)
            n,kind=struct.unpack_from("<I4s",blob,12)
            assert kind==b"JSON"
            g=json.loads(blob[20:20+n])
            skins=g.get("skins",[])
            meshes=g.get("meshes",[])
            prims=[p for m in meshes for p in m.get("primitives",[])]
            coat=next(x for x in g.get("materials",[]) if x["name"]=="Main")
            has_tex="baseColorTexture" in coat.get("pbrMetallicRoughness",{})
            has_norm="normalTexture" in coat
            assert len(g.get("animations",[]))==13
            assert any(len(x["joints"])==50 for x in skins)
            assert any("TEXCOORD_0" in p.get("attributes",{}) for p in prims)
            assert len(g.get("images",[]))>=2
            assert has_tex and has_norm,(horse,coat)
            assert report["bones"]==50 and len(report["clips"])==13
            assert all((folder/("V23_"+v+".png")).stat().st_size>10000 for v in ("side","front","back","isometric"))
            print("V23_REAL_GLB_PBR_PASS",horse,"images",len(g["images"]),"UV",has_tex,"normal",has_norm)
          PY
      - name: Deliver both CC0 skinned horses with real textured PBR GLB, BLEND and four image views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-horse-v23-${{ github.run_number }}
          path: outputs/v23/
          retention-days: 14
          if-no-files-found: warn
