name: Taiwan V31 - Hem Shading Diagnosis
on:
  push:
    branches: ['feat/taiwan-v31-shui-cloth-gravity-hem']
    paths: ['.github/workflows/taiwan-v31-hem-probe.yml','scripts/taiwan_v31_probe/**']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taiwan-v31-shui-gravity-towel-hem-PILOT
          run-id: 41202687871
          github-token: ${{ github.token }}
          repository: aitest-ai/3dcodeverse-lab
          path: input/prior
      - name: Install verified Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 2 --max-time 300 -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 2 --max-time 60 -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import pathlib,re,hashlib
          name='blender-5.2.3-linux-x64.tar.xz'
          row=next(x for x in pathlib.Path('.tools/SHA256').read_text().splitlines() if name in x)
          with open('.tools/'+name,'rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==re.search(r'[0-9a-fA-F]{64}',row).group().lower()
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Render four controlled shading probes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a blender -b --python-exit-code 1 --python scripts/taiwan_v31_probe/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-v31-hem-shading-diagnosis
          path: outputs/probe/**
          retention-days: 30
