name: Taiwan Street Game - 8 MPFB Characters ZIP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/taiwan-characters.yml'
      - 'scripts/taiwan_characters/**'
  push:
    paths:
      - '.github/workflows/taiwan-characters.yml'
      - 'scripts/taiwan_characters/**'
permissions:
  contents: read
  actions: read
jobs:
  build-taiwan-characters:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m compileall -q scripts/taiwan_characters
      # All v11 humans are generated independently from genuine MPFB2 source.
      # The obsolete original female BLEND download is intentionally removed.
      - name: Install CPU rendering and image checking requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libegl1 libxrender1 libxi6 libsm6 libxkbcommon0 libxxf86vm1 python3-pil
      - name: Install Blender 5.2.3 with upstream SHA256 verification
        run: |
          set -euo pipefail
          mkdir -p .tools
          BASE=https://download.blender.org/release/Blender5.2
          FILE=blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors -o ".tools/$FILE" "$BASE/$FILE"
          curl -fL --retry 4 --retry-all-errors -o .tools/SHA256 "$BASE/blender-5.2.3.sha256"
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          name="blender-5.2.3-linux-x64.tar.xz"
          line=next(line for line in Path(".tools/SHA256").read_text().splitlines() if name in line)
          checksum=re.search(r"[0-9a-fA-F]{64}",line).group().lower()
          with open(".tools/"+name,"rb") as f:
              assert hashlib.file_digest(f,"sha256").hexdigest()==checksum
          print("BLENDER_VERIFIED_SHA256",checksum)
          PY
          tar -xf ".tools/$FILE" -C .tools
          echo "$PWD/.tools/blender-5.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Install the official MPFB 2.0.18 extension for real phenotype morphing
        run: |
          set -euo pipefail
          mkdir -p .deps
          git clone --depth 1 -q https://github.com/makehumancommunity/mpfb2.git .deps/mpfb2
          grep -q 'version = "2.0.18"' .deps/mpfb2/src/mpfb/blender_manifest.toml
          blender --command extension build --source-dir .deps/mpfb2/src/mpfb --output-filepath "$PWD/.tools/mpfb.zip"
          blender --command extension repo-add local_mpfb --directory "$PWD/.tools/mpfb-extensions"
          blender --command extension install-file --repo local_mpfb --enable "$PWD/.tools/mpfb.zip"
          blender --command extension list
# ART-REJECTED: production 34-file zip disabled until true MPFB face pilot passes human review.
      - name: Restore cached official CC0 asset pack
        uses: actions/cache@v4
        with:
          path: .tools/makehuman_system_assets_cc0.zip
          key: makehuman-asset-packs-2026-10-30-v1
      - name: Retrieve and unpack official MakeHuman CC0 face assets
        run: |
          set -euo pipefail
          FILE=.tools/makehuman_system_assets_cc0.zip
          if [ ! -s "$FILE" ]; then
            for host in files2.makehumancommunity.org files.makehumancommunity.org; do
              if curl -fL --retry 2 --connect-timeout 25 --max-time 420 \
                  -o "$FILE" "https://$host/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip"; then break; fi
              rm -f "$FILE"
            done
          fi
          test "$(stat -c%s "$FILE")" -gt 200000000
          unzip -tq "$FILE" >/dev/null
          mkdir -p .deps/mh_assets
          unzip -oq "$FILE" -d .deps/mh_assets
          test -n "$(find .deps/mh_assets -name 'high-poly.mhclo' -print -quit)"
          test -n "$(find .deps/mh_assets -name 'young_caucasian_female.mhmat' -print -quit)"
      - name: Download official CC0 Faceunits 01 ARKit blendshape targets
        run: |
          set -euo pipefail
          mkdir -p .deps/faceunits
          file=.deps/faceunits01_cc0.zip
          for host in files2.makehumancommunity.org files.makehumancommunity.org; do
            if curl -fL --retry 2 --connect-timeout 20 --max-time 120 \
                -o "$file" "https://$host/functional/faceunits01.zip"; then break; fi
            rm -f "$file"
          done
          unzip -tq "$file"
          unzip -oq "$file" -d .deps/faceunits
          find .deps/faceunits -type f | head -30
          test "$(find .deps/faceunits -name '*.target*' | wc -l)" -ge 8
      - name: Test source-authentic ARKit expressions on different male faces
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MAKEHUMAN_ASSET_ROOT: .deps/mh_assets
          MAKEHUMAN_FACEUNITS_ROOT: .deps/faceunits
          FACE_OUT: outputs/face_v13
          FACE_EXPORT_GLB: '1'
        run: |
          set -euo pipefail
          mkdir -p outputs/face_v13
          for id in you jie; do
            FACE_ID="$id" xvfb-run -a blender -b \
              --python-exit-code 1 --python scripts/taiwan_characters/face_v13_fastface.py
          done
      - name: Validate 8 nonzero ARKit keys, skinned GLB and 7 real Blender images each
        run: |
          set -euo pipefail
          for id in you_v13_fastface jie_v13_fastface; do
            p="outputs/face_v13/$id.glb"
            python3 scripts/taiwan_characters/optimize_embedded_glb.py "$p" "$p.optimized" 512
            mv "$p.optimized" "$p"
          done
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path("outputs/face_v13")
          required={"mouthOpen","mouthSmileLeft","mouthSmileRight",
            "eyeBlinkLeft","eyeBlinkRight","browInnerUp","mouthFrownLeft","mouthFrownRight"}
          for name in ("you_v13_fastface","jie_v13_fastface"):
              info=json.loads((root/(name+"_report.json")).read_text())
              assert info["body_vertices"]==13380
              assert set(info["arkit_shape_keys"])==required
              assert all(row["changed_source_vertices"]>3 and row["max_offset_m"]>.00001
                for row in info["arkit_shape_keys"].values())
              assert len(info["views"])==4 and len(info["expression_renders"])==3
              for filename in info["views"]+info["expression_renders"]:
                  assert (root/filename).stat().st_size>15000,filename
              p=root/(name+".glb")
              with p.open("rb") as fh:
                  magic,version,total=struct.unpack("<4sII",fh.read(12))
                  length,kind=struct.unpack("<I4s",fh.read(8))
                  doc=json.loads(fh.read(length))
              assert magic==b"glTF" and version==2 and total==p.stat().st_size<=6000000
              assert doc.get("skins")
              candidate=[]
              for m in doc.get("meshes",[]):
                  for primitive in m.get("primitives",[]):
                      count=len(primitive.get("targets",[]))
                      if count>=8:candidate.append((m.get("name"),count))
              assert candidate,("No real morphs in exported GLB",name)
              print("VERIFIED_REAL_ARKIT_8_MORPHS",name,candidate)
          PY
      - name: Archive expression test GLB and real face renders (not final)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-v13-fast-original-ARKit-no-clothes-FACE-ONLY
          path: outputs/face_v13/
          retention-days: 14
          if-no-files-found: warn
