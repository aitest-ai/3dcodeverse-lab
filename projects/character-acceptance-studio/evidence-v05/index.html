<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.5.0 實際瀏覽器動作證據</title><style>body{margin:24px;background:#eef2ed;color:#24352e;font:16px system-ui}main{max-width:1300px;margin:auto}img{width:100%;border-radius:12px}select,button,input{padding:10px;margin:6px}video{width:min(100%,1000px)}a{color:#176849}p{line-height:1.7}</style><main><h1>實際瀏覽器 A/B 連續畫面</h1><p>208 張 Chromium WebGL 畫面；A 與 B 同片段、同相位、同鏡位。以下是取樣畫面播放器，不代表即時效能或人工美術核准。<a href="../web-v05/">開啟即時 3D 驗收場</a></p><select id="seq"></select><button id="play">播放取樣</button><input id="phase" type="range" min="0" max="7" step="1" value="0"><span id="label"></span><img id="image"><h2>實際錄影</h2><p>柴犬 WebM：瀏覽器 canvas 連續錄製，要求 6 秒牆鐘時間，實際編碼約 5.36 秒；SwiftShader 可能掉格。手機真機未測。</p><video controls src="shiba-live-browser.webm"></video><p><a href="browser-contacts.json">120 Hz 接地量測</a> · <a href="browser-ui.json">瀏覽器操作結果</a> · <a href="blender-cold.json">母檔冷開檢查</a> · <a href="../README_V05.md">限制與來源</a></p></main><script>let data,index=0,active=false,last=0;const $=id=>document.getElementById(id);function show(){const s=data[index],f=s.frames[+$('phase').value];$('image').src=f.file;$('label').textContent=`${f.time_s.toFixed(3)} s · ${Math.round(f.phase*100)}%`;}fetch('frame-catalog.json').then(r=>r.json()).then(x=>{data=x.sequences;data.forEach((s,i)=>$('seq').add(new Option(`${s.key} / ${s.clip} / ${s.view}`,i)));show()});$('seq').onchange=()=>{index=+$('seq').value;$('phase').max=data[index].frames.length-1;$('phase').value=0;show()};$('phase').oninput=()=>{active=false;show()};$('play').onclick=()=>{active=!active;$('play').textContent=active?'暫停取樣':'播放取樣'};function tick(t){requestAnimationFrame(tick);if(!active||!data)return;const s=data[index];if(t-last>s.duration_s*1000/s.frames.length){$('phase').value=(+$('phase').value+1)%s.frames.length;show();last=t}}requestAnimationFrame(tick);</script>
