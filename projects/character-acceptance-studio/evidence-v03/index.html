<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.3.0 實際畫面證據</title><style>body{font:16px system-ui;background:#182321;color:#e7eee5;margin:24px auto;max-width:1200px;padding:0 16px}a{color:#b2d99c}select,input{font:inherit;margin:8px}video{width:100%;max-height:75vh;background:#101815}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%}figure{margin:0}p{line-height:1.6}.warning{color:#f4d7a3}</style><h1>0.3.0 實際畫面證據</h1><p><a href="../web-v03/">回互動驗收場</a> · <a href="../docs/GARMENT_STAGE_V03.md">驗收／缺陷</a> · <a href="browser-metrics-summary.json">瀏覽器數字</a> · <a href="editor-qa.json">母檔檢查</a></p><p class="warning">候選，尚未美術核准。影片每鏡位 8 個獨立 WebGL 畫面，24fps 容器重複格，不能用來判定效能。完整連續播放與逐格請開驗收場。</p><label>角色<select id="character"><option value="harbor-courier-review">Harbor</option><option value="taiwan-oldman-review">V29 阿伯</option></select></label><label>動作<select id="clip"><option>Walk</option><option>Run</option><option>Start</option><option>Stop</option><option>TurnLeft</option><option>TurnRight</option></select></label><p id="mode"></p><video controls loop muted playsinline id="video"></video><p id="missing" hidden class="warning">尚未找到 Evidence 包影片／畫面；請將 Evidence ZIP 解壓到與 Runtime_Source 相同根目錄。</p><label>取樣相位 <input id="frame" type="range" min="0" max="7" value="0"><output id="number">0 / 7</output></label><div class="grid" id="frames"></div><p>完整來源／鏡位／時間／hash：<a href="frame-catalog.json">四鏡位索引</a> · <a href="detail-catalog.json">關節、胸口、衣襬、世界位移近景索引</a>。近景原圖依索引的 file 路徑開啟。</p><script>
const $=id=>document.getElementById(id);function update(){const c=$('character').value,k=$('clip').value,i=Number($('frame').value);$('number').textContent=i+' / 7';$('missing').hidden=true;$('mode').textContent=true?'每鏡位左 A=v0.2 修正候選；右 B=v0.3。同步動作比例。':'僅 B=v0.3；阿伯 v0.2 無此片段，沒有修改前對照。';const src='../videos-v03/'+c+'-'+k.toLowerCase()+'-webgl.mp4';if($('video').getAttribute('src')!==src)$('video').src=src;$('frames').replaceChildren();for(const v of ['front','side','back','feetwide']){const f=document.createElement('figure'),t=document.createElement('figcaption'),img=document.createElement('img');t.textContent=v+' · phase '+i+'/8';img.src='frames/'+c+'/'+k+'/'+v+'/'+String(i).padStart(3,'0')+'.png';img.alt=t.textContent;img.onerror=()=>{$('missing').hidden=false};f.append(t,img);$('frames').append(f)}}$('video').onerror=()=>{$('missing').hidden=false};$('character').onchange=update;$('clip').onchange=update;$('frame').oninput=update;update();</script></html>
