<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人物與動物動作修正 · Character Lab 05</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../web/vendor/three.module.js","three/addons/":"../web/vendor/jsm/"}}</script></head><body>
<header><div><small>CHARACTER LAB / 05</small><h1>人物與動物動作修正</h1><p>Vivi 與柴犬 · 同鏡位比較接地、關節與服裝</p></div><nav><a href="https://github.com/aitest-ai/3dcodeverse-lab/blob/6d3729627c27f49f5303729a46d4d5f0c041136f/projects/character-acceptance-studio/README_V03.md">既有人物 A/B 驗收場 ↗</a><a href="../README_V05.md">操作與授權</a></nav></header>
<main><aside class="library"><div class="sticky"><h2>模型目錄 <span id="count"></span></h2><input id="search" type="search" aria-label="搜尋模型" placeholder="搜尋名稱、作者、種類…"><div class="filters" id="filters"><button data-filter="all" class="active">全部</button><button data-filter="game">遊戲人物</button><button data-filter="anime">動漫 / VTuber</button><button data-filter="animal">動物</button></div><p class="hint">CC0 素材 · 鎖定版本 · 全部仍待人工美術驗收</p></div><div id="cards"></div></aside>
<section class="workspace"><div class="toolbar"><div><h2 id="title">載入模型目錄…</h2><p id="subtitle"></p></div><label class="check"><input id="compare" type="checkbox">同鏡位比較</label><label class="check" hidden><input id="alignHeight" type="checkbox">等高檢視</label><label class="check"><input id="follow" type="checkbox" checked>跟隨位移</label><select id="modelB" aria-label="比較模型 B" hidden></select></div>
<div id="stage"><div id="load" role="status" aria-live="polite"><b id="loadText">讀取目錄…</b><progress id="progress" max="1" value="0"></progress></div><div id="error" role="alert" hidden></div><div id="labels"><span id="labelA"></span><span id="labelB" hidden></span></div><div id="metrics"></div></div>
<div class="views"><button data-view="full" class="active">全身</button><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="head">頭部</button><button data-view="torso">胸腹／關節</button><button data-view="feet">腳掌／蹄</button><label class="check"><input id="skeleton" type="checkbox">骨架</label><button id="retry">重新載入</button></div>
<div class="playback"><label>動作 A <select id="clipA"></select></label><label id="clipBLabel" hidden>動作 B <select id="clipB"></select></label><div class="transport"><button id="prev">−1 格</button><button id="play">暫停</button><button id="next">+1 格</button><label class="check"><input id="loop" type="checkbox" checked>循環</label><label>速度 <input id="rate" type="range" min="0.1" max="2" step="0.1" value="1"><output id="rateValue">1.0×</output></label></div><input id="timeline" aria-label="動畫時間" type="range" min="0" max="1" step="0.001" value="0"><div class="row"><output id="time">0.000 s</output><span id="clipNote"></span></div></div>
<div id="vrmControls" hidden><label>VRM 表情 <select id="expression"><option value="neutral">自然</option><option value="happy">笑容</option><option value="blink">閉眼</option><option value="aa">發音 A</option></select></label><span>使用原檔表情；走跑已烘焙於原生骨架；髮衣即時物理停用。</span></div>
<p id="warning" class="notice"></p><div class="capture"><button id="png">儲存畫面</button><button id="record">錄製 6 秒</button><span id="recordStatus"></span><a href="../evidence-v05/">多視角證據 ↗</a></div>
<details><summary>來源、授權、原始母檔與完整雜湊</summary><div id="downloads"></div><pre id="metadata"></pre></details>
<details open><summary>記錄比例與適配問題</summary><p class="hint">A 是修正前候選、B 是本階段修正結果；兩者保留同一套原始網格與材質。數值通過不等於美術核准。</p><div class="row"><select id="region" aria-label="驗收部位"><option>身形／頭身比與輪廓</option><option>衣物／接縫與穿模</option><option>動作／關節與重心</option><option>腳掌／蹄接地</option><option>臉部／表情與材質</option></select><select id="verdict" aria-label="驗收判定"><option value="unreviewed">未測</option><option value="failed">需要修正</option><option value="observed-pass">這次觀察通過</option></select></div><textarea id="notes" placeholder="記錄動作名稱、時間、角度與需要調整的部位。"></textarea><div class="row"><button id="saveReview">加入觀察</button><button id="exportReview">匯出觀察 JSON</button><span id="reviewCount">0 筆</span></div></details>
</section></main><footer>工作室 0.5.0 · 原生模型候選庫 · 人工美術、手機真機與遊戲內驗收尚未完成</footer><script type="module" src="app.js"></script></body></html>
