<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型庫 0.4・實際瀏覽器證據</title><style>body{font:16px/1.6 system-ui;background:#f4f5f0;color:#26372f;max-width:1200px;margin:25px auto;padding:0 20px}a{color:#1a6654}select,button,input{font:inherit;padding:5px;margin:4px}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}img{width:100%;background:#dce5de}figure{margin:0}figcaption{font-size:13px}.notice{background:#fff4d9;padding:12px}video{max-width:100%;width:800px}@media(max-width:650px){#grid{grid-template-columns:1fr}}</style><h1>20 個模型的實際瀏覽器畫面</h1><p><a href="../web-v04/">開啟互動模型庫</a> · <a href="browser-all-clips.json">20 模型／532 片段項目的抽樣報告</a> · <a href="browser-ui-qa.json">操作檢查</a> · <a href="../README_V04.md">限制與操作說明</a></p><p class="notice">下方是 Chromium／Three.js 畫面。動作每循環取 4 個時點；翻頁播放不是連續錄影，也不等於動作與服裝已通過人工驗收。VRoid 三個模型僅有參考姿勢。</p><label>模型<select id="model"></select></label><label>動作<select id="motion"></select></label><button id="play">播放取樣畫面</button><input id="phase" type="range" min="0" max="3" value="0" step="1"><span id="status"></span><div id="grid"></div><h2>直接錄製瀏覽器動畫</h2><p>柴犬原生 Walk，以工作室「錄製 6 秒」按鈕取得。軟體繪圖可能掉格；實際長度見錄影報告。</p><video controls preload="metadata" src="shibainu-native-walk.webm"></video><p><a href="recording-qa.json">錄影檢查</a> · <a href="frame-catalog.json">含時間、鏡位、版本與雜湊的完整畫面索引</a></p><script>
(async()=>{const c=await(await fetch('frame-catalog.json')).json(),a=await(await fetch('../library-v04/catalog.json')).json(),$=id=>document.getElementById(id);let timer;for(const e of a.entries)$('model').add(new Option(e.name,e.id));function clips(){const seq=c.sequences.filter(x=>x.id===$('model').value);$('motion').replaceChildren();for(const name of [...new Set(seq.map(x=>x.clip))])$('motion').add(new Option(name==='__rest'?'參考姿勢（無動畫）':name,name));draw()}function draw(){const seq=c.sequences.filter(x=>x.id===$('model').value&&x.clip===$('motion').value);$('grid').replaceChildren();for(const s of seq){const f=s.frames[Number($('phase').value)%s.frames.length],fig=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src=f.file;im.alt=s.id+' '+s.view;cap.textContent=s.view+' · '+(f.phase*100)+'% · '+f.snapshot.assets[0].sha256.slice(0,16);fig.append(im,cap);$('grid').append(fig)}$('status').textContent='取樣 '+(Number($('phase').value)+1)+'/4'}$('model').onchange=clips;$('motion').onchange=draw;$('phase').oninput=draw;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放取樣畫面'}else{timer=setInterval(()=>{$('phase').value=(Number($('phase').value)+1)%4;draw()},500);$('play').textContent='停止取樣播放'}};clips()})().catch(e=>document.body.append('讀取失敗：'+e.message));
</script></html>
