<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馬匹 0.13 驗收證據</title><style>body{max-width:1100px;margin:32px auto;padding:16px;font:16px/1.6 system-ui;color:#183c30;background:#f4f7f3}img,video{max-width:100%;max-height:75vh}button,select{font:inherit;padding:8px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{margin:24px 0}a{color:#17624c}</style><h1>馬匹 0.13：起停未鎖蹄試驗 A／鎖蹄候選 B</h1><p>實際 Chromium 動畫連續畫面與錄影。A 是本輪新建的未鎖蹄對照試驗，並非 v12 成品。B 使用相同加減速與身體混合，再解算世界接地。StartWalk／StopWalk 為逐段鏡位，FullSequence 包含完整路徑與接縫前後；紫點並非物理重心。</p><p><a href="../web-v13/">回到可操作工作室</a> · <a href="../README_V13.md">重建與限制</a></p><select id="choice"></select><button id="prev">上一張</button><button id="next">下一張</button><span id="position"></span><article><img id="frame" alt="瀏覽器動畫連續畫面"><details><summary>此格角色版本、雜湊、時間與鏡位</summary><pre id="metadata"></pre></details></article><h2>實際瀏覽器錄影</h2><p>CPU 軟體繪圖可能掉格；編碼時長另列，未當作手機效能證據。</p><video controls src="horse-brown-browser.webm"></video><video controls src="horse-white-browser.webm"></video><details><summary>完整驗收摘要</summary><pre id="report"></pre></details><script type="module">const $=id=>document.getElementById(id),data=await(await fetch('frame-catalog.json')).json();let index=0;for(const [i,s]of data.sequences.entries())$('choice').add(new Option(`${s.key} / ${s.clip} / ${s.view}`,i));function draw(){const s=data.sequences[Number($('choice').value)],f=s.frames[index];$('frame').src=f.file;$('position').textContent=`${index+1} / ${s.frames.length} · ${f.time_s.toFixed(4)} s`;$('metadata').textContent=JSON.stringify(f.snapshot,null,2)}$('choice').onchange=()=>{index=0;draw()};$('prev').onclick=()=>{index=(index+data.sequences[$('choice').value].frames.length-1)%data.sequences[$('choice').value].frames.length;draw()};$('next').onclick=()=>{index=(index+1)%data.sequences[$('choice').value].frames.length;draw()};draw();$('report').textContent=JSON.stringify(await(await fetch('acceptance-summary.json')).json(),null,2)</script></html>
