<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivi 0.2 實際瀏覽器驗收證據</title><style>body{font:16px system-ui;margin:2rem auto;max-width:1200px;padding:0 1rem;background:#f4f6f0;color:#233429}img,video{width:100%;border-radius:10px}button,select{font:inherit;padding:.6rem;margin:.2rem}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:1rem}a{color:#26683c}</style><h1>Vivi 0.2 · 實際瀏覽器連續畫面</h1><p>A：上一版 0.1 接地候選。B：0.2 手型、裙片與轉身修正。以下全部來自 Chromium 畫面，沒有生成圖或離線渲染；美術、真機與完整衣物碰撞未核准。</p><p><a href="../web-v06/">開啟即時 3D 驗收場</a> · <a href="../README_V06.md">操作／重現</a> · <a href="frame-catalog.json">時間與鏡位／SHA</a> · <a href="acceptance-summary.json">驗收摘要</a></p><select id="choice" aria-label="動作與鏡位"></select><button id="prev">上一格</button><button id="next">下一格</button><button id="play">播放離散取樣</button><p id="caption"></p><a id="original"><img id="frame" alt="同鏡位 A/B 實際畫面"></a><h2>真實 Canvas 錄影</h2><p>要求錄製 6 秒；編碼時長見下方結果。CPU 軟體繪圖可能掉格。連續畫面可逐張檢視；即時頁可以任意時間暫停與逐格。</p><video controls src="run-browser.webm"></video><h2>結果與尚未驗收項目</h2><pre id="report"></pre><script type="module">const $=x=>document.getElementById(x),data=await(await fetch('frame-catalog.json')).json();let k=0,timer;data.sequences.forEach((s,i)=>$('choice').add(new Option(s.clip+' / '+s.view,i)));function show(){const s=data.sequences[$('choice').value||0],f=s.frames[k];$('frame').src=f.file;$('original').href=f.file;$('caption').textContent=`${s.clip} / ${s.view} · ${k+1}/${s.frames.length} · ${f.time_s.toFixed(3)} s`;}$('choice').onchange=()=>{k=0;show()};function step(d){const s=data.sequences[$('choice').value||0];k=(k+d+s.frames.length)%s.frames.length;show()}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放離散取樣'}else{timer=setInterval(()=>step(1),600);$('play').textContent='暫停'}};show();$('report').textContent=JSON.stringify(await(await fetch('acceptance-summary.json')).json(),null,2);</script></html>
